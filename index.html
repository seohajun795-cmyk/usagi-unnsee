<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>치이카와 공부 운수 픽셀 에디션</title>
<style>
@font-face{font-family:'DungGeunMo';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff');}
*{box-sizing:border-box}
body{font-family:'DungGeunMo','Courier New',monospace;background:#fdf2f8;background-image:linear-gradient(#f9d5e8 2px,transparent 2px),linear-gradient(90deg,#f9d5e8 2px,transparent 2px);background-size:32px 32px;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;margin:0;color:#333;overflow-x:hidden}
#bg{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none}
#bg img{position:absolute;opacity:.28;animation:floaty linear infinite;filter:drop-shadow(2px 0 0 #000) drop-shadow(-2px 0 0 #000)}
@keyframes floaty{0%{transform:translate(0,0) rotate(-8deg)}25%{transform:translate(40px,-60px) rotate(6deg)}50%{transform:translate(-30px,-110px) rotate(-6deg)}75%{transform:translate(50px,-50px) rotate(8deg)}100%{transform:translate(0,0) rotate(-8deg)}}
.box{position:relative;z-index:1;border:4px solid #000;box-shadow:6px 6px 0 #000;background:#fff;padding:24px;width:92%;max-width:480px;text-align:center;margin:24px 0}
.btn{display:block;width:100%;border:4px solid #000;box-shadow:4px 4px 0 #000;background:#ff9ed2;color:#fff;padding:12px 20px;font-size:21px;cursor:pointer;font-family:inherit;text-shadow:2px 2px 0 #000;margin-top:16px}
.btn.sub{background:#8fd3ff}.btn.gray{background:#bbb;font-size:17px}
.btn:active{box-shadow:0 0 0 #000;transform:translate(4px,4px)}
.hidden{display:none!important}
.img{max-width:150px;max-height:170px;display:block;margin:12px auto}
h1{font-size:32px;color:#fff;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;margin:0}
input{width:100%;font-family:inherit;font-size:22px;padding:10px;border:4px solid #000;text-align:center;margin-top:12px}
#machine{image-rendering:pixelated;width:216px;height:270px;cursor:pointer;display:block;margin:6px auto 0}
#cap{image-rendering:pixelated;width:72px;height:72px;cursor:pointer;display:block;margin:-34px auto 4px;position:relative}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-2deg)}75%{transform:translateX(6px) rotate(2deg)}}
.drop{animation:drop .8s cubic-bezier(.3,1.4,.5,1) forwards}
@keyframes drop{0%{transform:translateY(-70px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.pop{animation:pop .4s ease-out forwards}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.bounce{animation:bounce .8s infinite alternate}
@keyframes bounce{to{transform:translateY(-12px)}}
.item{margin:10px 0;font-size:19px;background:#fff0f5;border:2px dashed #ff9ed2;padding:10px}
.bubble{position:relative;text-align:left;background:#fff;border:4px solid #000;box-shadow:4px 4px 0 #000;padding:14px;margin:0 0 22px;font-size:17px;line-height:1.5}
.bubble::after{content:'';position:absolute;left:50%;bottom:-20px;margin-left:-10px;border:10px solid transparent;border-top:12px solid #000}
.bubble b{color:#ff52a2}
.who{font-size:15px;color:#666}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.uid{border:4px solid #000;background:#fff0f5;padding:10px 4px;font-family:inherit;font-size:18px;cursor:pointer;box-shadow:3px 3px 0 #000}
.uid small{display:block;color:#888;font-size:13px}
.rec{border:3px solid #000;background:#fff;margin:12px 0;padding:10px;text-align:left;font-size:16px;line-height:1.5}
.rec img{float:right;width:70px;margin:0 0 6px 8px}
.rec .d{color:#888;font-size:13px}
#note{font-size:13px;color:#c0392b;margin-top:10px}
</style></head><body>
<div id="bg"></div>

<div id="s-menu" class="box">
<h1>치이카와<br>공부 운수</h1>
<img id="menu-img" class="img bounce" alt="">
<button class="btn" onclick="show('login')">🎰 뽑으러가기</button>
<button class="btn sub" onclick="openList()">👀 다른 사람들 운수보기</button>
<div id="note"></div>
</div>

<div id="s-login" class="box hidden">
<h2>아이디를 입력해줘!</h2>
<img id="login-img" class="img" alt="">
<input id="uid" maxlength="12" placeholder="닉네임 / 아이디" onkeydown="if(event.key==='Enter')goDraw()">
<button class="btn" onclick="goDraw()">시작! 🐾</button>
<button class="btn gray" onclick="show('menu')">← 처음으로</button>
</div>

<div id="s-gacha" class="box hidden">
<h2 id="g-title">기계를 눌러서 뽑아봐!</h2>
<div id="g-stage">
<canvas id="machine" width="48" height="60" onclick="pull()"></canvas>
<canvas id="cap" width="12" height="12" class="hidden" onclick="openCap()"></canvas>
<p id="g-hint" style="color:#666;font-size:16px">(기계를 클릭!)</p>
</div>
<div id="g-res"></div>
<button class="btn gray" onclick="show('menu')">← 처음으로</button>
</div>

<div id="s-list" class="box hidden">
<h2>다른 사람들 운수</h2>
<p style="font-size:15px;color:#666">아이디를 눌러서 운수를 쭉 봐!</p>
<div id="ulist" class="grid"></div>
<button class="btn sub" onclick="openList()">🔄 새로고침</button>
<button class="btn gray" onclick="show('menu')">← 처음으로</button>
</div>

<div id="s-detail" class="box hidden">
<h2 id="d-name"></h2>
<div id="d-recs"></div>
<button class="btn gray" onclick="show('list')">← 목록으로</button>
</div>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(n){['menu','login','gacha','list','detail'].forEach(x=>$('s-'+x).classList.toggle('hidden',x!==n));if(n==='menu')window.scrollTo(0,0)}
$('menu-img').src=IMG.glasses;$('login-img').src=IMG.usagi;
if(!FIREBASE_URL)$('note').textContent='※ 공유 저장소 미설정: 현재는 이 기기에만 저장돼요.';

/* 배경 */
const bg=$('bg');
['glasses','usagi','bread','broom','spear','happy','kuri','candy','studying','sleeping','suit'].forEach(k=>{for(let j=0;j<2;j++){const e=document.createElement('img');e.src=IMG[k];
e.style.width=(70+Math.random()*70)+'px';e.style.left=(Math.random()*90)+'%';e.style.top=(Math.random()*85)+'%';
e.style.animationDuration=(12+Math.random()*12)+'s';e.style.animationDelay=(-Math.random()*20)+'s';bg.appendChild(e);}});

/* 저장소 */
async function save(id,rec){
 if(FIREBASE_URL){await fetch(FIREBASE_URL+'/users/'+encodeURIComponent(id)+'.json',{method:'POST',body:JSON.stringify(rec)});return}
 const d=JSON.parse(localStorage.getItem('chii_users')||'{}');(d[id]=d[id]||[]).push(rec);localStorage.setItem('chii_users',JSON.stringify(d));
}
async function loadAll(){
 if(FIREBASE_URL){const r=await fetch(FIREBASE_URL+'/users.json');const j=await r.json()||{};const o={};for(const k in j)o[k]=Object.values(j[k]);return o}
 return JSON.parse(localStorage.getItem('chii_users')||'{}');
}

/* 픽셀 기계 */
function px(ctx,x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function drawMachine(frame){
 const c=$('machine').getContext('2d');c.clearRect(0,0,48,60);
 const K='#000';
 // 돔
 for(let y=0;y<34;y++)for(let x=0;x<48;x++){const d=Math.hypot(x-24,y-18);
  if(d<=17&&y<=33){c.fillStyle=d>15?K:(d>13?'#9bdcf5':'#d8f4ff');c.fillRect(x,y,1,1)}}
 // 캡슐들
 const caps=[[14,24,'#ff6fae'],[22,27,'#ffd84d'],[30,24,'#7fd6ff'],[18,19,'#a8e06a'],[27,19,'#ff9e5e'],[23,12,'#c9a0ff'],[34,28,'#ff6fae'],[11,29,'#ffd84d']];
 caps.forEach(([x,y,col])=>{px(c,x-3,y-3,6,6,K);px(c,x-2,y-2,4,2,col);px(c,x-2,y,4,2,'#fff')});
 px(c,13,6,3,2,'#fff');px(c,11,8,2,2,'#fff'); // 반사광
 // 뚜껑 띠
 px(c,8,33,32,3,K);px(c,9,34,30,1,'#ffd84d');
 // 몸체
 px(c,6,36,36,24,K);px(c,8,36,32,22,'#ff6fae');px(c,8,36,3,22,'#ff9ed2');px(c,37,36,3,22,'#d94d8c');
 // 라벨
 px(c,13,38,22,9,K);px(c,14,39,20,7,'#fff');
 [[16,41],[18,40],[20,41],[22,43],[24,41],[26,40],[28,41]].forEach(([x,y])=>px(c,x,y,2,2,'#ff52a2'));
 px(c,30,42,2,2,'#ff52a2');
 // 손잡이
 px(c,17,48,14,10,K);px(c,18,49,12,8,'#ffd84d');
 if(frame%2===0){px(c,23,50,2,6,K);px(c,21,52,6,2,K)}else{px(c,21,50,2,2,K);px(c,25,50,2,2,K);px(c,23,52,2,2,K);px(c,21,54,2,2,K);px(c,25,54,2,2,K)}
 // 배출구
 px(c,31,50,8,8,K);px(c,32,51,6,6,'#444');
}
function drawCap(col){
 const c=$('cap').getContext('2d');c.clearRect(0,0,12,12);
 for(let y=0;y<12;y++)for(let x=0;x<12;x++){const d=Math.hypot(x-5.5,y-5.5);if(d<=6){
  c.fillStyle=d>4.8?'#000':(y<6?col:'#fff');c.fillRect(x,y,1,1)}}
 px(c,0,5,12,1,'#000');px(c,3,2,2,1,'#fff');
}
let me='',cur=null,step=0,frame=0,busy=false;
function goDraw(){
 const v=$('uid').value.trim().replace(/[.$#\[\]\/]/g,'');
 if(!v){$('uid').focus();return}
 me=v;resetGacha();show('gacha');
}
function resetGacha(){
 step=0;cur=null;busy=false;
 $('g-title').textContent=me+'의 운수 뽑기!';
 $('g-stage').classList.remove('hidden');$('g-res').innerHTML='';
 $('machine').classList.remove('hidden');$('cap').classList.add('hidden');
 $('g-hint').textContent='(기계를 클릭!)';drawMachine(0);
}
function pull(){
 if(busy||step!==0)return;busy=true;
 const m=$('machine');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake');
 let n=0;const iv=setInterval(()=>{drawMachine(++frame);if(++n>=6)clearInterval(iv)},100);
 cur=Math.floor(Math.random()*F.length);
 setTimeout(()=>{
  drawCap(['#ff6fae','#ffd84d','#7fd6ff','#a8e06a','#ff9e5e'][Math.floor(Math.random()*5)]);
  const cp=$('cap');cp.classList.remove('hidden','drop');void cp.offsetWidth;cp.classList.add('drop');
  $('g-hint').textContent='(캡슐을 클릭해서 열어봐!)';step=1;busy=false;
  const f=F[cur];save(me,{f:cur,ts:Date.now()}).catch(()=>{$('g-hint').textContent+=' ⚠ 저장 실패'});
 },800);
}
function openCap(){
 if(step<1||step>4)return;const f=F[cur],r=$('g-res');
 const cp=$('cap');cp.classList.remove('shake','drop');void cp.offsetWidth;cp.classList.add('shake');
 if(step===1)r.innerHTML+='<div class="item pop" style="color:#ff52a2;font-weight:bold">'+esc(f.t)+'</div>';
 else if(step===2)r.innerHTML+='<div class="item pop">'+esc(f.s)+'</div>';
 else if(step===3)r.innerHTML+='<div class="item pop">행운 아이템<br>'+esc(f.l)+'</div>';
 else{
  $('g-stage').classList.add('hidden');$('g-title').textContent='오늘의 운수 결과!';
  r.innerHTML='<div class="bubble pop"><div class="who">💬 '+NAMES[f.img]+'의 한마디</div><b>['+esc(f.g)+'] '+esc(f.sum)+'</b><br><br>'+esc(f.e)+'<br><br>📣 '+esc(f.c)+'</div>'
  +'<img src="'+IMG[f.img]+'" class="img pop">'
  +'<button class="btn" onclick="resetGacha()">다시 뽑기</button>';
 }
 step++;
 if(step===4)$('g-hint').textContent='(한 번 더 클릭하면 결과 발표!)';
}
/* 목록 */
async function openList(){
 show('list');const u=$('ulist');u.innerHTML='<p>불러오는 중...</p>';
 try{const all=await loadAll();const ids=Object.keys(all);
  if(!ids.length){u.innerHTML='<p style="grid-column:1/3">아직 아무도 안 뽑았어!</p>';return}
  u.innerHTML='';ids.sort().forEach(id=>{const b=document.createElement('button');b.className='uid';
   b.innerHTML=esc(id)+'<small>'+all[id].length+'회 뽑음</small>';b.onclick=()=>openUser(id,all[id]);u.appendChild(b)});
 }catch(e){u.innerHTML='<p style="grid-column:1/3">불러오기 실패 😢</p>'}
}
function openUser(id,recs){
 $('d-name').textContent=id+'의 운수';
 $('d-recs').innerHTML=recs.slice().sort((a,b)=>b.ts-a.ts).map(r=>{const f=F[r.f];if(!f)return '';
  return '<div class="rec"><img src="'+IMG[f.img]+'"><div class="d">'+new Date(r.ts).toLocaleString('ko-KR')+'</div><b>'+esc(f.t)+'</b><br>'+esc(f.s)+'<br>'+esc(f.l)+'<br>💬 '+esc(f.sum)+'<br>📣 '+esc(f.c)+'<div style="clear:both"></div></div>'}).join('');
 show('detail');
}
drawMachine(0);
